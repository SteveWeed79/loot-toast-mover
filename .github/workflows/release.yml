name: Release

# Publishing is manual. Nothing here fires on a schedule: the addon has real users, and
# an unattended upload to CurseForge is not something that should happen while nobody is
# looking.
#
# Two ways in:
#
#   1. Run it from the Actions tab (or via the API) and pick a bump. It bumps the version,
#      writes a changelog entry, commits, tags, tests, and publishes to CurseForge and
#      GitHub releases. Pick "none" to release what is already committed without changing
#      the version.
#
#   2. Push a v* tag by hand, which just packages and publishes that tag.
#
# Tick "update_interface" when a new game patch has landed: it pulls the current retail
# Interface version into the TOC as part of the release, rather than anyone remembering the
# number. Being an expansion behind is what took this addon out of service once already --
# a 12.x client will not load anything below Interface 120000 -- but noticing that and
# shipping to players are separate decisions, and this keeps the second one yours.
#
# Bumping and publishing live in one job on purpose. Pushing a tag from a workflow does not
# start another workflow, because GitHub does not trigger runs from events made with
# GITHUB_TOKEN, so a job that only tagged would appear to succeed and publish nothing.
#
# Publishing needs a CF_API_KEY repository secret holding a CurseForge API token. The
# project id lives in LootToastMover.toc as X-Curse-Project-ID.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: none
        options: [none, patch, minor, major]
      notes:
        description: "Changelog line for this release"
        type: string
        required: false
        default: ""
      update_interface:
        description: "Also pull the current retail Interface version into the TOC"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the tag, the commit, and the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the packager can see tags

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # Opt-in, for when a new game patch has landed. Retail only: a beta or PTR Interface
      # number would mark the addon out of date on the very client it is meant to support.
      - name: Update the TOC Interface version
        if: inputs.update_interface
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: retail

      - name: Check what the Interface update changed
        if: inputs.update_interface
        run: |
          if git diff --quiet -- LootToastMover.toc; then
            echo "Interface version was already current."
          else
            git --no-pager diff -- LootToastMover.toc
            # A new Interface version has to ship under a new addon version, or there is
            # nothing for players to update to.
            if [ "${{ inputs.bump }}" = "none" ]; then
              echo "::error::The Interface version changed, so this needs a version bump to reach anyone. Re-run with bump: patch."
              exit 1
            fi
          fi

      - name: Apply the version bump
        if: github.event_name != 'push' && inputs.bump != 'none'
        id: version
        run: |
          VERSION=$(lua5.1 tools/bump_version.lua "${{ inputs.bump }}" "${{ inputs.notes }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # "none" changes no version, but still needs the current one to tag.
      - name: Read the current version
        if: github.event_name != 'push' && inputs.bump == 'none'
        id: current
        run: echo "version=$(lua5.1 tools/bump_version.lua none)" >> "$GITHUB_OUTPUT"

      # Nothing ships without passing the same checks as every other change.
      - name: Tests
        run: |
          lua5.1 tests/run_tests.lua
          lua5.1 tests/check_toc.lua

      - name: Commit, tag and push
        if: github.event_name != 'push'
        run: |
          VERSION="${{ steps.version.outputs.version || steps.current.outputs.version }}"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Pick a different bump."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit when something actually changed -- "none" with no Interface update
          # leaves the tree clean.
          if ! git diff --quiet; then
            git add LootToastMover.toc LootToastMover.lua CHANGELOG.md
            git commit -m "Release $VERSION"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag -a "$TAG" -m "$VERSION"
          git push origin "$TAG"

      - name: Publish
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
